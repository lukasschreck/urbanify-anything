[project]
name = "urbanify"
version = "0.1.0"
description = "Eine beliebige Stadt, die Stunde drumherum, und welche Quellen dort Termine führen"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["opendata", "openstreetmap", "isochrone", "events", "valhalla", "civic-tech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "icalendar>=6.0",
    "recurring-ical-events>=3.3",
    "timezonefinder>=6.5",
]

[project.urls]
Repository = "https://github.com/lukasschreck/urbanify-anything"
Issues = "https://github.com/lukasschreck/urbanify-anything/issues"

[project.scripts]
urbanify = "urbanify.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urbanify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
